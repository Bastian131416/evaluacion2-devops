name: Pipeline CI/CD - Evaluacion 2

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v3

    - name: Autenticar en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir y subir imagenes de Docker
      run: |
        docker compose build
        docker tag evaluacion2-back-ventas bastian13/back-ventas:latest
        docker tag evaluacion2-back-despachos bastian13/back-despachos:latest
        docker tag evaluacion2-front-despacho bastian13/front-despacho:latest
        docker push bastian13/back-ventas:latest
        docker push bastian13/back-despachos:latest
        docker push bastian13/front-despacho:latest
